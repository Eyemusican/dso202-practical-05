apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: webapp-qa

labels:
  - pairs:
      environment: qa
    includeSelectors: false

replicas:
  - name: webapp
    count: 2

configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html

patchesJson6902:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: webapp
    path: patch-annotation.yaml
